<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <title>To do list</title>
  </head>
  <body>
    <div class="todoApp">
      <header class="todoHeader">
        <h1 class="dayOfWeek">Среда</h1>
        <p class="currentDate">3 января</p>
      </header>

      <div class="searchBar">
        <input type="text" placeholder="Поиск" id="searchInput" />
        <span class="material-symbols-rounded searchIcon">search</span>
      </div>

      <div class="todoFilters">
        <button class="filterBtn dynamicActive">Все</button>
        <button class="filterBtn">Активные</button>
        <button class="filterBtn">Завершенные</button>
      </div>

      <ul class="taskList"></ul>

      <button class="floatingActionBtn" id="openModalBtn">
        <span class="material-symbols-rounded btnIcon">edit</span>
      </button>

      <div class="modalOverlay" id="todoModal">
        <div class="modalContent">
          <div class="modalDragLine"></div>

          <div class="modalInputGroup">
            <input type="text" id="taskDescInput" placeholder="Описание" />
          </div>

          <div class="modalInputGroup">
            <input
              type="text"
              id="taskDateInput"
              placeholder="Дата"
              autocomplete="off"
            />
          </div>

          <div class="reminderBlock">
            <span class="reminderText">Напомнить мне</span>
            <label class="switch">
              <input type="checkbox" id="reminderToggle" checked />
              <span class="slider">
                <span class="material-symbols-rounded switchIcon">check</span>
              </span>
            </label>
          </div>

          <div class="modalActions">
            <button class="modalBtn btnCancel" id="closeModalBtn">
              Отмена
            </button>
            <button class="modalBtn btnAdd" id="saveTaskBtn">Добавить</button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="scripts/script.js"></script>
</html>
